<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>bonsai-obs</title>
<style>
  body { width: 260px; margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; }
  header { background: #2f9e44; color: #fff; padding: 10px 12px; }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .05em; }
  header small { opacity: .85; }
  section { padding: 10px 12px; border-bottom: 1px solid #eee; }
  a { display: block; padding: 6px 0; color: #1c7ed6; text-decoration: none; font-size: 13px; }
  a:hover { text-decoration: underline; }
  .repo { font-weight: 700; font-size: 13px; word-break: break-all; }
  .btn { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px;
         background: #2f9e44; color: #fff; font-size: 12px; cursor: pointer; }
  .btn:hover { background: #2b8a3e; }
  .muted { color: #868e96; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>bonsai-obs 🔭</h1>
  <small>観測所 クイックアクセス</small>
</header>
<section>
  <a target="_blank" href="https://github.com/bonsai/repos-analyze">repos-analyze（本家）</a>
  <a target="_blank" href="https://github.com/bonsai/repo-snapshot-skill">repo-snapshot-skill</a>
  <a target="_blank" href="https://github.com/bonsai">proile（bonsai 一覧）</a>
</section>
<section>
  <div class="repo" id="repo">—</div>
  <div class="muted">現在のタブの GitHub repo</div>
  <button class="btn" id="copy">URL をコピー</button>
</section>
<script src="popup.js"></script>
</body>
</html>
